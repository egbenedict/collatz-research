name: B5 sharded (fast solver over many runners)
# Run from the Actions tab or: gh workflow run b5-sharded.yml -f N=326 -f T=350 -f KMAX=349 -f B3=357

# Computes every odd n < 2^N whose first five rises total >= T (b5mitm.c, sharded by work item).
# Also confirms the KMAX input: b4mitm finds no n < 2^N with a four-rise total >= KMAX+1 (cap B3 = b3(N)).
# Used for B5(326), the one new input that m = 136 needs (ideas/log.md I-017).

on:
  workflow_dispatch:
    inputs:
      N:    { description: "bit length N", default: "326" }
      T:    { description: "threshold T", default: "350" }
      KMAX: { description: "b4(N): cap on the first four rises", default: "349" }
      B3:   { description: "b3(N): cap used to confirm KMAX with b4mitm", default: "357" }
      NS:   { description: "number of shards (<= 256)", default: "64" }
      B4T:  { description: "optional: also list four-rise totals >= B4T (exact B4 / positive control)", default: "" }
      K0MIN: { description: "partial search only (lower bounds): keep items with k0 >= K0MIN", default: "1" }
      K0MAX: { description: "partial search only: keep items with k0 <= K0MAX (empty = N)", default: "" }
      L0MAX: { description: "partial search only: keep items with l0 <= L0MAX (large = no limit)", default: "100000" }

env:
  NS: ${{ inputs.NS }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.m.outputs.shards }}
    steps:
      - id: m
        run: echo "shards=$(python3 -c 'import json; print(json.dumps(list(range(int("${{ inputs.NS }}")))))')" >> "$GITHUB_OUTPUT"

  b4confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: confirm B4(N) <= KMAX with b4mitm
        working-directory: tools/xcheck
        run: |
          gcc -O3 -march=native -o b4mitm b4mitm.c
          T4=$(( ${{ inputs.KMAX }} + 1 ))
          ./b4mitm ${{ inputs.N }} $T4 ${{ inputs.B3 }} | tee b4.txt
          grep -q "max_total=-1" b4.txt
          if grep -q UNRESOLVED b4.txt; then exit 1; fi
      - name: exact B4 (optional)
        if: ${{ inputs.B4T != '' }}
        working-directory: tools/xcheck
        run: |
          ./b4mitm ${{ inputs.N }} ${{ inputs.B4T }} ${{ inputs.B3 }} > b4exact.txt
          tail -1 b4exact.txt; grep -c '^HIT' b4exact.txt || true
          sort -t= -k2 -n -r b4exact.txt | head -5
      - uses: actions/upload-artifact@v4
        with: { name: b4confirm, path: "tools/xcheck/b4*.txt" }

  shard:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.setup.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - name: build and run one shard (4 threads)
        working-directory: tools/xcheck/b5
        run: |
          gcc -O3 -march=native -DLIMBS=16 -o b5mitm b5mitm.c -lpthread
          export K0MIN=${{ inputs.K0MIN }} K0MAX=${{ inputs.K0MAX || inputs.N }} L0MAX=${{ inputs.L0MAX }}
          /usr/bin/time -v ./b5mitm ${{ inputs.N }} ${{ inputs.T }} ${{ inputs.KMAX }} 4 ${{ matrix.shard }} $NS > shard_${{ matrix.shard }}.txt 2> time_${{ matrix.shard }}.txt
          tail -1 shard_${{ matrix.shard }}.txt
          grep -E "Elapsed|Maximum resident" time_${{ matrix.shard }}.txt
      - uses: actions/upload-artifact@v4
        with: { name: "shard-${{ matrix.shard }}", path: "tools/xcheck/b5/shard_${{ matrix.shard }}.txt" }

  combine:
    needs: [b4confirm, shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - name: combine shards
        run: |
          set -e
          n=$(cat out/shard-*/shard_*.txt | grep -c '^SUMMARY')
          echo "summaries: $n / $NS"; test "$n" -eq "$NS"
          if grep -h '^UNRESOLVED' out/shard-*/shard_*.txt; then exit 1; fi
          bad=$(grep -h '^SUMMARY' out/shard-*/shard_*.txt | sed 's/.* bad=\([0-9]*\).*/\1/' | paste -sd+ | bc)
          left=$(grep -h '^SUMMARY' out/shard-*/shard_*.txt | sed 's/.* left=\([0-9]*\).*/\1/' | paste -sd+ | bc)
          # sort by total (no `sort -t=`: it failed on the runner and the old `|| true` hid it)
          grep -h '^HIT' out/shard-*/shard_*.txt | sed 's/^HIT total=\([0-9]*\) /\1 &/' | sort -k1,1nr | cut -d' ' -f2- > hits.txt
          nh=$(grep -h '^SUMMARY' out/shard-*/shard_*.txt | sed 's/.* hits=\([0-9]*\).*/\1/' | paste -sd+ | bc)
          echo "hit lines $(wc -l < hits.txt), per-shard hit counts sum $nh"; test "$(wc -l < hits.txt)" -eq "$nh"
          max=$(head -1 hits.txt | sed 's/HIT total=\([0-9]*\).*/\1/')
          { echo "### B5 sharded: N=${{ inputs.N }} T=${{ inputs.T }} KMAX=${{ inputs.KMAX }}"
            echo "- shards: $n/$NS, bad=$bad, left prefixes=$left, hits=$(wc -l < hits.txt), max total=${max:-none (< T)}"
            echo "- b4confirm: ${{ needs.b4confirm.result }}"
            echo '```'; head -40 hits.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          test "$bad" -eq 0
          test "${{ needs.b4confirm.result }}" = success
      - uses: actions/upload-artifact@v4
        with: { name: combined, path: hits.txt }
